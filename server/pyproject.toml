[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = []
package-mode = true

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic-settings = "^2.7"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"
httpx = "^0.28"
PyJWT = "^2.10"
cryptography = "^46.0"
greenlet = "^3.3.2"
slowapi = "^0.1.9"
sentry-sdk = "^2.58.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
httpx = "^0.28"
ruff = "^0.15.6"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["app/services/github_client.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["database/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",   # FastAPI uses Depends/Query as default argument values by design
  "E402",   # Module-level imports not at top (side-effect imports in main.py)
  "E712",   # SQLAlchemy ORM uses == True/False for SQL expression generation
  "UP046",  # Generic[T] subclass form required for Pydantic BaseModel compatibility
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
