name: Smoke Tests

on:
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: distilled
          POSTGRES_PASSWORD: distilled
          POSTGRES_DB: distilled
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install server dependencies
        working-directory: server
        run: poetry install

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Configure server environment
        working-directory: server
        run: cp .env.example .env

      - name: Run migrations
        working-directory: server
        run: poetry run alembic upgrade head

      - name: Seed demo data
        working-directory: server
        run: PYTHONPATH=. poetry run python scripts/seed_demo.py

      - name: Start server
        working-directory: server
        run: poetry run uvicorn app.main:app --port 8000 &

      - name: Start client
        working-directory: client
        run: npm run dev &

      - name: Wait for services to be ready
        run: npx wait-on http://localhost:8000/docs http://localhost:5173 --timeout 60000

      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
