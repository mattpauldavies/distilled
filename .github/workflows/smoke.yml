name: Smoke Tests

on:
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://distilled:distilled@localhost:5432/distilled
      SEED_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      SEED_TENANT_NAME: dev
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_SMOKE_USER_ID: ${{ secrets.CLERK_SMOKE_USER_ID }}
      CLERK_SMOKE_USER_EMAIL: ${{ secrets.CLERK_SMOKE_USER_EMAIL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: distilled
          POSTGRES_PASSWORD: distilled
          POSTGRES_DB: distilled
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install server dependencies
        working-directory: server
        run: poetry install

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run migrations
        working-directory: server
        run: poetry run alembic upgrade head

      - name: Seed demo data
        working-directory: server
        run: PYTHONPATH=. poetry run python scripts/seed_demo.py

      - name: Start server
        working-directory: server
        run: poetry run uvicorn app.main:app --port 8000 &

      - name: Start client
        working-directory: client
        run: npm run dev &

      - name: Wait for services to be ready
        run: npx wait-on http-get://localhost:8000/api/health http://localhost:5173 --timeout 60000

      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
