services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: distilled
      POSTGRES_USER: distilled
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distilled}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distilled"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    ports:
      - "5050:8081"
    environment:
      DATABASE_URL: postgres://distilled:${POSTGRES_PASSWORD:-distilled}@postgres:5432/distilled?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
